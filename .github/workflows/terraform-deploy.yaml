name: 'Build and Release Terraform to Azure'

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  working_directory: 'Terraform/VirtualMachine'

jobs:
  # ============================================================
  # BUILD STAGE: Validate and Plan Terraform
  # ============================================================
  build:
    name: 'Build - Terraform Plan'
    runs-on: ubuntu-latest
    
    outputs:
      plan-exists: ${{ steps.plan.outputs.exists }}

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.14.6"

    - name: Terraform Init
      run: terraform init
      working-directory: ${{ env.working_directory }}

    - name: Terraform Format Check
      run: terraform fmt -check
      working-directory: ${{ env.working_directory }}

    - name: Terraform Validate
      run: terraform validate
      working-directory: ${{ env.working_directory }}

    - name: Terraform Plan
      id: plan
      run: |
        terraform plan -input=false \
          -var="admin_password=${{ secrets.ADMIN_PASSWORD }}" \
          -out=tfplan
        echo "exists=true" >> $GITHUB_OUTPUT
      working-directory: ${{ env.working_directory }}

    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: ${{ env.working_directory }}/tfplan
        retention-days: 7

  # ============================================================
  # RELEASE STAGE: Apply with Environment Approvals
  # ============================================================
  release:
    name: 'Release - Environment'
    runs-on: ubuntu-latest
    needs: build
    environment: 
      name: production
  
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.14.6"

    - name: Download Terraform Plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan
        path: ${{ env.working_directory }}

    - name: Terraform Init
      run: terraform init
      working-directory: ${{ env.working_directory }}

    - name: Terraform Apply
      run: |
        terraform apply -input=false tfplan
      working-directory: ${{ env.working_directory }}